<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="用于搭建、检查和计算泵浦探测光路的二维光学平台编辑器" />
  <title>Optical Bench · 光路工作台</title>
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%230a111e'/%3E%3Cpath d='M8 42h18l10-20 8 20h12' fill='none' stroke='%234fd1c5' stroke-width='6' stroke-linecap='round' stroke-linejoin='round'/%3E%3Ccircle cx='36' cy='22' r='5' fill='%23ffb454'/%3E%3C/svg%3E" />
  <link rel="stylesheet" href="styles.css" />
  <style>.workspace{overflow:scroll!important;scrollbar-color:#415673 #0a111c;scrollbar-width:auto}#canvas{min-width:100%;min-height:100%;flex:none}.rotation-stem{stroke:#ffb454;stroke-width:1.5;stroke-dasharray:3 3;pointer-events:none}.rotation-handle{fill:#101a29;stroke:#ffb454;stroke-width:2;cursor:crosshair}.aperture-edge{stroke:#6d819b;stroke-width:1;stroke-dasharray:2 2;pointer-events:none}.warning-text{fill:#ffb454;font-size:10px;text-anchor:middle;pointer-events:none}.beam-envelope{opacity:.13;pointer-events:none}.beam-envelope.clipped{opacity:.25;stroke:#ffb454;stroke-width:.7;stroke-dasharray:3 2}.selection-box{fill:#4fd1c51c;stroke:#4fd1c5;stroke-width:1.3;stroke-dasharray:5 3;pointer-events:none}.multi-selected{fill:none;stroke:#ffb454;stroke-width:2;pointer-events:none}.focus-marker{fill:#07101b;stroke:#fff;stroke-width:1.6}.focus-marker.virtual{stroke:#ffb454;stroke-dasharray:2 2}.focus-label{fill:#dce8f7;font-size:9px;text-anchor:middle;pointer-events:none}.delay-diagram path{fill:none;stroke:#8ee9df;stroke-width:2;stroke-linecap:round;pointer-events:none}.scan-chart{display:block;width:100%;height:84px;margin-top:6px}.scan-chart path{stroke:#33445c;fill:none}.scan-chart polyline{stroke:#4fd1c5;stroke-width:2;fill:none}</style>
</head>
<body>
  <header class="topbar">
    <div class="brand"><span class="brand-mark">⌁</span><div><strong>Optical Bench</strong><small>二维光路工作台</small></div></div>
    <div class="toolbar">
      <button id="rayToggleBtn" class="tool-btn active">自动追迹：开 <kbd>B</kbd></button>
      <button id="measureBtn" class="tool-btn">测量路径 <kbd>M</kbd></button>
      <button id="rotateBtn" class="tool-btn">旋转器件 <kbd>R</kbd></button>
      <button id="deleteBtn" class="tool-btn danger">删除 <kbd>Del</kbd></button>
      <button id="alignBtn" class="tool-btn">双光阑对准 <kbd>A</kbd></button>
      <button id="undoBtn" class="tool-btn" disabled>撤销 <kbd>Ctrl Z</kbd></button>
      <button id="redoBtn" class="tool-btn" disabled>重做 <kbd>Ctrl Y</kbd></button>
      <span class="divider"></span>
      <button id="saveBtn" class="tool-btn">保存</button>
      <button id="exportBtn" class="tool-btn">导出 JSON</button>
      <label class="tool-btn file-label">导入<input id="importInput" type="file" accept="application/json" /></label>
    </div>
  </header>

  <main class="app-shell">
    <aside class="sidebar left-panel">
      <section>
        <div class="section-title"><span>器件库</span><small>点击添加</small></div>
        <div id="componentLibrary" class="component-library"></div>
      </section>
      <section>
        <div class="section-title"><span>光学平台</span></div>
        <div class="form-grid compact">
          <label>横向孔数<input id="boardCols" type="number" min="4" max="80" value="24" /></label>
          <label>纵向孔数<input id="boardRows" type="number" min="4" max="60" value="16" /></label>
          <label>孔距 (mm)<input id="holeSpacing" type="number" min="10" max="50" value="25" /></label>
        </div>
        <button id="addBoardBtn" class="wide-btn">＋ 添加一块平台</button>
      </section>
      <section class="legend">
        <div class="section-title"><span>光束颜色</span></div>
        <div><i class="dot uv"></i>≤450 nm</div><div><i class="dot visible"></i>可见光</div><div><i class="dot ir"></i>≥700 nm</div>
      </section>
    </aside>

    <section class="workspace-wrap">
      <div id="statusBar" class="status-bar"><span class="status-dot"></span><span id="statusText">选择器件，或从左侧添加新器件</span><span id="zoomText">100%</span></div>
      <div id="workspace" class="workspace" tabindex="0" aria-label="光路编辑画布">
        <svg id="canvas" xmlns="http://www.w3.org/2000/svg" aria-label="二维光学平台"></svg>
        <div id="tooltip" class="beam-tooltip" role="tooltip"></div>
      </div>
      <div class="canvas-help">Ctrl＋鼠标左键拖动：平移画布 · 滚动条辅助定位 · 两束光时空重合时 BBO 生成混频光</div>
    </section>

    <aside class="sidebar right-panel">
      <section>
        <div class="section-title"><span>属性</span><small id="selectionType">未选择</small></div>
        <div id="emptyInspector" class="empty-state">点击平台、器件或光束查看并编辑参数。</div>
        <div id="inspector" class="inspector hidden"></div>
      </section>
      <section>
        <div class="section-title"><span>路径计算</span></div>
        <div id="pathResult" class="path-result">
          <p>点击样品可比较所有命中光束；也可以点击“测量路径”后选择光源和终点。</p>
        </div>
      </section>
      <section>
        <div class="section-title"><span>光路诊断</span></div>
        <div id="diagnosticResult" class="path-result"><p>光阑偏心、高度错层和探测器饱和会显示在这里。</p></div>
      </section>
      <section>
        <div class="section-title"><span>当前设计</span></div>
        <div class="summary-grid"><div><strong id="componentCount">0</strong><small>器件</small></div><div><strong id="beamCount">0</strong><small>光束段</small></div><div><strong id="sourceCount">0</strong><small>光源</small></div></div>
      </section>
    </aside>
  </main>

  <script src="components.js"></script>
  <script src="app.js"></script>
</body>
</html>
